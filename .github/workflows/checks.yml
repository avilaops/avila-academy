name: Verificação
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          PORT=3071 node server.ts &
          trap 'kill $!' EXIT
          for i in {1..30}; do curl -fsS http://localhost:3071/api/academy && break; sleep 1; done
          xvfb-run -a node test/browser.cjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: academy_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE academy_app LOGIN PASSWORD 'test-academy-only' NOBYPASSRLS;"
      - run: psql -X -v ON_ERROR_STOP=1 -f migrations/postgres/001-academy.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f migrations/postgres/001-academy.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f test/postgres/isolation.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://academy_app:test-academy-only@127.0.0.1:5432/academy_test
          POSTGRES_ADMIN_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/academy_test
